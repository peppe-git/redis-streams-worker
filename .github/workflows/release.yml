# SPDX-License-Identifier: Apache-2.0
#
# Publishes a release to Maven Central. See RELEASING.md.
# The bundle is uploaded and validated, then waits in the Central Portal for a manual "Publish".
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # run it on a tag ("Use workflow from" → Tags)

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Check that the tag matches a release version
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Run this workflow on a tag (v<version>), not on '$GITHUB_REF_NAME'"
            exit 1
          fi
          version="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::The POM version is $version: a SNAPSHOT cannot be released"
            exit 1
          fi
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the POM version $version"
            exit 1
          fi
          echo "Releasing $version"
      - name: Build, test, sign and upload to the Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -Prelease deploy
